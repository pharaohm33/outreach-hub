<!doctype html>
<meta charset="utf-8">
<title>Outreach Hub (demo harness)</title>
<body>Loading demo&hellip;
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script type="module">
// Runs the real UI against the real Worker code, an in-memory database and a fake SignalWire. Handy for trying the app without any accounts. Open: /test/app.html
import { createBackend, WORKER_ORIGIN, PASSWORD } from './fake-backend.js';

window.__be = await createBackend();

// There is no browser phone any more: SignalWire rings your cell. These helpers play SignalWire's part
// so you can step through a call from the console (see window.__sim below).
Object.defineProperty(navigator, 'mediaDevices', { configurable: true, value: { getUserMedia: async () => ({ getTracks: () => [] }) } });

// ?seed=1 pre-fills a connected number, contacts and a voicemail so the screens have something to show.
if (new URLSearchParams(location.search).has('seed')) {
  const call = (m, p, b) => fetch(WORKER_ORIGIN + '/api' + p, { method: m, headers: { Authorization: 'Bearer ' + PASSWORD, 'content-type': 'application/json' }, body: b && JSON.stringify(b) });
  await call('POST', '/setup', { phone_sid: 'PN1', phone_number: '+14155550100', agent_phone: '(650) 555-0199' });
  await call('PUT', '/settings', { window_start: 0, window_end: 24, call_script: 'Hi {{first_name}}, this is Sam. Do you have a minute?' });
  await call('POST', '/contacts/import', { tags: ['subscribers'], contacts: [
    { first_name: 'Ann', last_name: 'Lee', phone: '4155550101', company: 'Acme', email: 'ann@example.com' },
    { first_name: 'Bob', last_name: 'Ray', phone: '4155550102', company: 'Globex' },
    { first_name: 'Cy', last_name: 'Doe', phone: '4155550103' },
  ] });
  await call('POST', '/recordings', { name: 'October intro', mime: 'audio/wav', data: btoa('RIFFxxxxWAVE'), seconds: 24 });
}

// Console helpers that act like SignalWire:  __sim.answerPhone(), __sim.lead(callId, 'human'|'machine_end_beep'), __sim.status(callId, 'completed')
window.__sim = {
  answerPhone: () => window.__be.webhook('/hook/agent-answer', { CallSid: window.__be.lastSid('/Calls') }),
  lead: (id, answeredBy) => window.__be.webhook(`/hook/lead-answer?call=${id}`, { AnsweredBy: answeredBy }),
  status: (id, CallStatus, CallDuration = '10') => window.__be.webhook(`/hook/call-status?call=${id}`, { CallStatus, CallDuration }),
  hangupPhone: () => window.__be.webhook('/hook/agent-status', { CallSid: window.__be.swLog.filter((l) => l.path === '/Calls' && l.params.Url.includes('agent-answer')).pop().sid, CallStatus: 'completed' }),
};

localStorage.setItem('outreach-hub.config', JSON.stringify({ url: WORKER_ORIGIN, password: PASSWORD }));
const html = await (await fetch('/docs/index.html')).text();
document.open();
document.write(html.replace('<head>', '<head><base href="/docs/">'));
document.close();
</script>
