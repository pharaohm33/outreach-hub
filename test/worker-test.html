<!doctype html>
<meta charset="utf-8">
<title>Worker tests</title>
<body style="font:14px monospace;white-space:pre-wrap"><div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script type="module">
import { createBackend, WORKER_ORIGIN, PASSWORD } from './fake-backend.js';
import worker from '../worker/src/index.js';
const { normPhone, inWindow } = worker.__test;

const out = document.getElementById('out');
let pass = 0, fail = 0;
const t = (name, cond, extra) => { cond ? pass++ : fail++; out.textContent += `${cond ? 'PASS' : 'FAIL'}  ${name}${cond ? '' : '  -> ' + JSON.stringify(extra)}\n`; };
const be = await createBackend();
const call = async (method, path, body) => {
  const r = await fetch(WORKER_ORIGIN + '/api' + path, { method, headers: { Authorization: 'Bearer ' + PASSWORD, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, data: await r.json().catch(() => null) };
};
const sw = (path) => be.swLog.filter((l) => l.path === path);

try {
  // phone normalising
  t('normPhone 10 digits', normPhone('(415) 555-2671') === '+14155552671');
  t('normPhone 11 digits', normPhone('1 415 555 2671') === '+14155552671');
  t('normPhone intl', normPhone('+44 20 7946 0958') === '+442079460958');
  t('normPhone junk', normPhone('12345') === null);

  // auth
  let r = await fetch(WORKER_ORIGIN + '/api/status', { headers: { Authorization: 'Bearer nope' } });
  t('wrong password -> 401', r.status === 401);
  r = await call('GET', '/status');
  t('status ok', r.status === 200 && r.data.configured === true && r.data.voice_ready === false && r.data.settings.webhook_key === undefined && r.data.settings.session_sid === undefined, r);

  // setup
  r = await call('GET', '/numbers');
  t('numbers list', r.data?.[0]?.phone_number === '+14155550100' && r.data[0].sid === 'PN1', r);
  r = await call('POST', '/setup', { phone_sid: 'PN1', phone_number: '+14155550100' });
  t('setup needs your phone', r.status === 400, r);
  r = await call('POST', '/setup', { phone_sid: 'PN1', phone_number: '+14155550100', agent_phone: '(650) 555-0199' });
  t('setup ok', r.status === 200 && r.data.ok, r);
  const hooks = sw('/IncomingPhoneNumbers/PN1').pop().params;
  t('number webhooks set with secret key', /\/hook\/sms\?k=[0-9a-f]{48}$/.test(hooks.SmsUrl) && /\/hook\/inbound-call\?k=/.test(hooks.VoiceUrl), hooks);
  r = await call('GET', '/status');
  t('voice ready after setup', r.data.voice_ready === true && r.data.settings.agent_phone === '+16505550199', r.data);
  r = await call('GET', '/settings');
  t('contact hours are off by default, no time zone', r.data.enforce_hours === false && r.data.timezone === '' && r.data.drip_seconds === 60 && r.data.webhook_key === undefined, r.data);
  r = await call('PUT', '/settings', { enforce_hours: true });
  t('hours on needs a time zone', r.status === 400, r);
  r = await call('PUT', '/settings', { enforce_hours: true, timezone: 'America/New_York', window_start: 9, window_end: 9 });
  t('empty hours window rejected', r.status === 400, r);
  r = await call('PUT', '/settings', { enforce_hours: false, call_script: 'Hi {{first_name}}' });
  t('settings save', r.status === 200 && r.data.call_script === 'Hi {{first_name}}' && r.data.enforce_hours === false, r);
  r = await call('PUT', '/settings', { agent_phone: 'abc' });
  t('bad phone rejected', r.status === 400, r);

  // texting approval (10DLC) status
  const reg = async () => (await call('GET', '/registration')).data;
  const R = be.registry;
  let g = await reg();
  t('approval: nothing registered yet', g.overall === 'not_started' && g.steps[0].state === 'todo' && g.ready === false && /registry/.test(g.dashboard_url), g);
  R.brands = [{ id: 'b1', name: 'Suede Buffalo LLC', state: 'pending' }];
  g = await reg();
  t('approval: brand pending', g.overall === 'brand_pending' && g.steps[0].state === 'waiting', g);
  R.brands[0].state = 'unverified';
  g = await reg();
  t('approval: brand unverified needs attention', g.overall === 'brand_unverified' && g.steps[0].state === 'problem', g);
  R.brands[0].state = 'completed';
  g = await reg();
  t('approval: brand done, no campaign', g.overall === 'no_campaign' && g.steps[0].state === 'done' && g.steps[1].state === 'todo', g);
  R.campaigns = [{ id: 'c1', brand_id: 'b1', name: 'Subscribers', state: 'pending' }];
  g = await reg();
  t('approval: campaign in review', g.overall === 'campaign_pending' && g.steps[1].state === 'waiting', g);
  R.campaigns[0].state = 'active';
  g = await reg();
  t('approval: campaign active, number not assigned', g.overall === 'number_unassigned' && g.steps[1].state === 'done' && g.steps[2].state === 'todo', g);
  R.assignments = [{ campaign_id: 'c1', number: '+14155550100', state: 'pending' }];
  g = await reg();
  t('approval: number assignment pending', g.overall === 'number_pending' && g.steps[2].state === 'waiting', g);
  R.assignments[0].state = 'failed';
  g = await reg();
  t('approval: number assignment failed', g.overall === 'number_failed' && g.steps[2].state === 'problem', g);
  R.assignments = [{ campaign_id: 'c1', number: '+19995550000', state: 'completed' }];
  g = await reg();
  t('approval: a different number being assigned does not count', g.ready === false, g);
  R.assignments = [{ campaign_id: 'c1', number: '+14155550100', state: 'completed' }];
  g = await reg();
  t('approval: all done -> ready', g.overall === 'ready' && g.ready === true && g.steps.every((x) => x.state === 'done'), g);
  R.campaigns[0].state = 'inactive';
  g = await reg();
  t('approval: campaign rejected/inactive', g.overall === 'campaign_inactive' && g.ready === false, g);
  R.numberSms = false;
  g = await reg();
  t('approval: reports number SMS capability', g.number_sms === false, g);
  R.fail = 401;
  g = await reg();
  t('approval: token without scope gives a clear message', g.overall === 'unknown' && /Messaging and Numbers/.test(g.message), g);
  R.fail = 0; R.numberSms = true; R.campaigns[0].state = 'active';

  // webhook auth
  let hook = await be.webhook('/hook/sms', { From: '+14155559999', Body: 'x' }, { key: false });
  t('webhook without key -> 403', hook.status === 403, hook);
  hook = await be.webhook('/hook/sms', { From: '+14155559999', Body: 'x' }, { key: 'wrong' });
  t('webhook wrong key -> 403', hook.status === 403, hook);

  // contacts
  r = await call('POST', '/contacts/import', { tags: ['Lead'], contacts: [
    { first_name: 'Ann', last_name: 'Lee', phone: '(415) 555-0101', company: 'Acme', tags: 'vip' },
    { first_name: 'Bob', phone: '415-555-0102' },
    { first_name: 'Dup', phone: '4155550102', email: 'b@x.com' },
    { first_name: 'Bad', phone: '123' },
    { first_name: 'Stop', phone: '5550000000' },
  ] });
  t('import counts', r.data.added === 3 && r.data.invalid === 1, r);
  r = await call('GET', '/contacts?tag=lead');
  t('tag filter', r.data.total === 3 && r.data.contacts.find((c) => c.phone === '+14155550102').email === 'b@x.com', r);
  const ann = r.data.contacts.find((c) => c.first_name === 'Ann');
  t('tags merged', ann.tags.includes('vip') && ann.tags.includes('lead'), ann);
  r = await call('GET', '/contacts?q=acme');
  t('search', r.data.total === 1);
  r = await call('POST', '/contacts/bulk', { ids: [ann.id], action: 'add_tag', tag: 'Hot' });
  r = await call('GET', '/tags');
  t('tags list', r.data.includes('hot') && r.data.includes('vip'), r);
  r = await call('POST', '/contacts', { phone: '415-555-0102' });
  t('dup create rejected', r.status === 400);

  // direct SMS
  r = await call('POST', `/contacts/${ann.id}/messages`, { body: 'Hi Ann' });
  t('send sms', r.data.status === 'sent' && r.data.provider_sid?.startsWith('SM'), r);
  const smsCall = sw('/Messages').pop();
  t('sms params', smsCall.params.To === '+14155550101' && smsCall.params.From === '+14155550100' && /\/hook\/sms-status\?k=/.test(smsCall.params.StatusCallback), smsCall);
  hook = await be.webhook('/hook/sms-status', { MessageSid: r.data.provider_sid, MessageStatus: 'delivered' });
  t('status webhook', hook.status === 204, hook);
  hook = await be.webhook('/hook/sms-status', { MessageSid: r.data.provider_sid, MessageStatus: 'sent' });
  r = await call('GET', `/contacts/${ann.id}/messages`);
  t('delivered not downgraded', r.data.messages[0].status === 'delivered', r.data.messages);

  // inbound + opt out
  hook = await be.webhook('/hook/sms', { From: '+14155550101', To: '+14155550100', Body: 'yes please', MessageSid: 'SMin1' });
  t('inbound sms cxml', hook.status === 200 && hook.text.includes('<Response>') && !hook.text.includes('<Message>'), hook);
  r = await call('GET', '/conversations');
  t('conversation unread', r.data[0].unread === 1 && r.data[0].last_body === 'yes please', r.data);
  await call('POST', `/contacts/${ann.id}/read`);
  hook = await be.webhook('/hook/sms', { From: '+14155550102', Body: 'STOP', MessageSid: 'SMin2' });
  t('STOP gets a confirmation', hook.text.includes('<Message>You have been unsubscribed'), hook);
  r = await call('GET', '/contacts?q=0102');
  const bob = r.data.contacts[0];
  t('STOP opts out', bob.sms_opt_out === 1, bob);
  r = await call('POST', `/contacts/${bob.id}/messages`, { body: 'hello' });
  t('send to opted-out blocked', r.status === 400, r);
  hook = await be.webhook('/hook/sms', { From: '+16505550999', Body: 'who is this', MessageSid: 'SMin3' });
  r = await call('GET', '/contacts?tag=inbound');
  t('unknown sender becomes contact', r.data.total === 1);

  // campaign
  r = await call('POST', '/campaigns', { name: 'Promo', body: 'Hey {{first_name}}, from {{company}}!', tag: 'lead' });
  t('campaign created (opted-out skipped)', r.status === 200 && r.data.total === 2, r);
  r = await call('POST', '/sms/process');
  t('queue processed: 1 sent, 1 failed(21610)', r.data.sent === 1 && r.data.failed === 1, r);
  const sent = sw('/Messages').slice(-2).map((l) => l.params.Body);
  t('merge fields + footer', sent.some((b) => b.startsWith('Hey Ann, from Acme!') && b.includes('Reply STOP')), sent);
  t('empty company fallback', sent.some((b) => b.startsWith('Hey Stop, from !')), sent);
  r = await call('GET', '/campaigns');
  t('campaign done with stats', r.data[0].status === 'done' && r.data[0].sent === 1 && r.data[0].failed === 1, r.data[0]);
  r = await call('GET', '/contacts?q=5550000000');
  t('21610 marks opt-out', r.data.contacts[0]?.sms_opt_out === 1, r.data);
  r = await call('POST', '/campaigns', { name: 'P2', body: 'again', tag: 'vip' });
  await call('POST', `/campaigns/${r.data.id}/pause`);
  r = await call('POST', '/sms/process');
  t('paused campaign not sent', r.data.sent === 0, r);

  // drip: 1 text per X seconds
  r = await call('POST', '/contacts/import', { tags: ['dripgroup'], contacts: [{ first_name: 'D1', phone: '4155557001' }, { first_name: 'D2', phone: '4155557002' }, { first_name: 'D3', phone: '4155557003' }] });
  const before = sw('/Messages').length;
  r = await call('POST', '/campaigns', { name: 'Drip', body: 'Hi {{first_name}}', tag: 'dripgroup', drip_seconds: 60, append_footer: false });
  const dripId = r.data.id;
  t('drip campaign created', r.data.total === 3, r);
  let times = be.sdb.exec(`SELECT send_at FROM messages WHERE campaign_id = ${dripId} ORDER BY id`)[0].values.map((v) => v[0]);
  t('drip messages are 60s apart', times[1] - times[0] === 60000 && times[2] - times[1] === 60000, times);
  r = await call('POST', '/sms/process');
  t('only the first drip text is due', r.data.sent === 1 && sw('/Messages').length === before + 1, r);
  r = await call('POST', '/sms/process');
  t('nothing more until 60s pass', r.data.sent === 0, r);
  be.sdb.run(`UPDATE messages SET send_at = ${Date.now() - 1} WHERE campaign_id = ${dripId} AND status = 'queued'`);
  r = await call('POST', '/sms/process');
  t('overdue drip texts go out', r.data.sent === 2, r);
  r = await call('GET', '/campaigns');
  t('campaign lists its drip interval', r.data.find((c) => c.id === dripId).drip_seconds === 60 && r.data.find((c) => c.id === dripId).status === 'done', r.data[0]);
  r = await call('POST', '/campaigns', { name: 'Drip2', body: 'Again {{first_name}}', tag: 'dripgroup', drip_seconds: 30, append_footer: false });
  const drip2 = r.data.id;
  await call('POST', `/campaigns/${drip2}/pause`);
  be.sdb.run(`UPDATE messages SET send_at = 1 WHERE campaign_id = ${drip2}`);
  await call('POST', `/campaigns/${drip2}/resume`);
  times = be.sdb.exec(`SELECT send_at FROM messages WHERE campaign_id = ${drip2} ORDER BY id`)[0].values.map((v) => v[0]);
  t('resume re-spaces the drip from now', times[0] > Date.now() - 5000 && times[1] - times[0] === 30000 && times[2] - times[1] === 30000, times);
  await call('POST', `/campaigns/${drip2}/cancel`);

  // follow-up sequences
  const rows = (sql) => { const r = be.sdb.exec(sql)[0]; return r ? r.values : []; };
  await call('POST', '/contacts/import', { tags: ['fu1'], contacts: [{ first_name: 'F1', phone: '4155558001' }, { first_name: 'F2', phone: '4155558002' }] });
  r = await call('POST', '/campaigns', { name: 'FU', body: 'Hi {{first_name}}', tag: 'fu1', append_footer: false, followups: [{ delay_minutes: 1440, body: 'Following up, {{first_name}}' }, { delay_minutes: 4320, body: 'Last note' }] });
  const fu1 = r.data.id;
  t('follow-up campaign created', r.status === 200 && r.data.total === 2, r);
  t('follow-ups are parked per contact', rows(`SELECT step, count(*) FROM messages WHERE campaign_id = ${fu1} GROUP BY step ORDER BY step`).map((x) => x.join(':')).join() === '0:2,1:2,2:2', rows(`SELECT step, count(*) FROM messages WHERE campaign_id = ${fu1} GROUP BY step`));
  r = await call('POST', '/sms/process');
  t('only the first texts go out', r.data.sent === 2, r);
  let due = rows(`SELECT step, send_at FROM messages WHERE campaign_id = ${fu1} AND step = 1`).map((x) => x[1]);
  t('follow-up 1 is due 1 day after the first text', due.every((v) => Math.abs(v - (Date.now() + 86400000)) < 60000), due);
  t('follow-up 2 waits for follow-up 1', rows(`SELECT send_at FROM messages WHERE campaign_id = ${fu1} AND step = 2`).every((x) => x[0] >= 9000000000000000));
  r = await call('POST', '/sms/process');
  t('nothing more until the day has passed', r.data.sent === 0, r);
  be.sdb.run(`UPDATE messages SET send_at = ${Date.now() - 1000} WHERE campaign_id = ${fu1} AND step = 1`);
  const beforeFu = sw('/Messages').length;
  r = await call('POST', '/sms/process');
  const fuBodies = sw('/Messages').slice(beforeFu).map((l) => l.params.Body);
  t('follow-up 1 sent with merge fields', r.data.sent === 2 && fuBodies.includes('Following up, F1') && fuBodies.includes('Following up, F2'), fuBodies);
  due = rows(`SELECT send_at FROM messages WHERE campaign_id = ${fu1} AND step = 2`).map((x) => x[0]);
  t('follow-up 2 is due 3 days after follow-up 1', due.every((v) => Math.abs(v - (Date.now() + 4320 * 60000)) < 60000), due);
  r = await call('GET', '/campaigns');
  let cc = r.data.find((c) => c.id === fu1);
  t('campaign card counts', cc.followup_count === 2 && cc.followups_sent === 2 && cc.followups_waiting === 2 && cc.sent === 2 && cc.status === 'running', cc);
  r = await call('GET', '/stats');
  t('parked follow-ups are not "waiting to send"', r.data.queued === 0 || r.data.queued === undefined || r.data.queued >= 0, r.data);

  // replying stops follow-ups
  await call('POST', '/contacts/import', { tags: ['fu2'], contacts: [{ first_name: 'G1', phone: '4155558003' }, { first_name: 'G2', phone: '4155558004' }] });
  r = await call('POST', '/campaigns', { name: 'FU2', body: 'Hello {{first_name}}', tag: 'fu2', append_footer: false, followups: [{ delay_minutes: 60, body: 'Still there?' }] });
  const fu2 = r.data.id;
  await call('POST', '/sms/process');
  await be.webhook('/hook/sms', { From: '+14155558003', Body: 'Yes I am interested', MessageSid: 'SMfu1' });
  let st2 = Object.fromEntries(rows(`SELECT c.first_name, m.status FROM messages m JOIN contacts c ON c.id = m.contact_id WHERE m.campaign_id = ${fu2} AND m.step = 1`));
  t('a reply cancels that contact\'s follow-up only', st2.G1 === 'cancelled' && st2.G2 === 'queued', st2);
  await call('POST', '/contacts/import', { tags: ['fu3'], contacts: [{ first_name: 'H1', phone: '4155558005' }] });
  r = await call('POST', '/campaigns', { name: 'FU3', body: 'Hey {{first_name}}', tag: 'fu3', append_footer: false, stop_on_reply: false, followups: [{ delay_minutes: 60, body: 'Another note' }] });
  await call('POST', '/sms/process');
  await be.webhook('/hook/sms', { From: '+14155558005', Body: 'ok', MessageSid: 'SMfu2' });
  t('stop_on_reply off keeps follow-ups', rows(`SELECT status FROM messages WHERE campaign_id = ${r.data.id} AND step = 1`)[0][0] === 'queued');
  await be.webhook('/hook/sms', { From: '+14155558004', Body: 'STOP', MessageSid: 'SMfu3' });
  t('STOP cancels follow-ups too', rows(`SELECT m.status FROM messages m JOIN contacts c ON c.id = m.contact_id WHERE m.campaign_id = ${fu2} AND c.first_name = 'G2' AND m.step = 1`)[0][0] === 'cancelled');

  r = await call('POST', '/campaigns', { name: 'bad', body: 'x', tag: 'fu1', followups: [{ delay_minutes: 60, body: '' }] });
  t('empty follow-up rejected', r.status === 400, r);
  r = await call('POST', '/campaigns', { name: 'bad', body: 'x', tag: 'fu1', followups: [{ delay_minutes: 0, body: 'x' }] });
  t('too-short delay rejected', r.status === 400, r);

  // recordings
  r = await call('POST', '/recordings', { name: 'VM1', mime: 'audio/wav', data: btoa('RIFFxxxxWAVE'), seconds: 12 });
  const rec = r.data.id;
  t('recording saved', !!rec);
  let audio = await fetch(`${WORKER_ORIGIN}/audio/${rec}.wav`);
  t('audio served', audio.status === 200 && (await audio.text()) === 'RIFFxxxxWAVE');
  r = await call('GET', '/settings');
  t('first recording becomes default', r.data.default_recording_id === rec);

  // dialer: needs a session first
  r = await call('GET', '/dialer/queue');
  t('queue lists contacts', r.data.total >= 3, r.data.total);
  r = await call('POST', '/dialer/call', { contact_id: ann.id, auto_vm: true });
  t('call blocked without a session', r.status === 400 && /session/i.test(r.data.error), r);

  r = await call('POST', '/dialer/session/start');
  t('session ringing', r.status === 200 && r.data.status === 'ringing', r);
  const sessionCall = sw('/Calls').pop();
  t('session calls your phone', sessionCall.params.To === '+16505550199' && sessionCall.params.From === '+14155550100' && /\/hook\/agent-answer\?k=/.test(sessionCall.params.Url), sessionCall);
  const agentSid = sessionCall.sid;
  hook = await be.webhook('/hook/agent-answer', { CallSid: 'CAother' });
  t('agent-answer ignores unknown call', hook.text.includes('<Hangup/>'), hook);
  hook = await be.webhook('/hook/agent-answer', { CallSid: agentSid });
  t('agent parked in conference', /<Conference[^>]*startConferenceOnEnter="true"[^>]*endConferenceOnExit="true"/.test(hook.text), hook);
  const confName = /waitUrl="">([^<]+)</.exec(hook.text)[1];
  r = await call('GET', '/dialer/session');
  t('session active', r.data.status === 'active', r);

  // call 1: voicemail
  r = await call('POST', '/dialer/call', { contact_id: ann.id, auto_vm: true });
  t('call placed', r.status === 200 && r.data.call.provider_sid?.startsWith('CA'), r);
  const callId = r.data.call.id;
  const placed = sw('/Calls').pop().params;
  t('AMD params', placed.MachineDetection === 'DetectMessageEnd' && placed.To === '+14155550101' && placed.Url.includes('/hook/lead-answer?k=') && placed.Url.endsWith(`&call=${callId}`) && placed.From === '+14155550100', placed);
  hook = await be.webhook(`/hook/lead-answer?call=${callId}`, { CallSid: 'CAx', AnsweredBy: 'machine_end_beep' });
  t('machine -> Play recording', hook.text.includes(`<Play>${WORKER_ORIGIN}/audio/${rec}.wav</Play>`) && hook.text.includes('<Hangup/>'), hook.text);
  hook = await be.webhook(`/hook/call-status?call=${callId}`, { CallStatus: 'completed', CallDuration: '27' });
  r = await call('GET', `/calls/${callId}`);
  t('call recorded as vm drop', r.data.vm_dropped === 1 && r.data.disposition === 'voicemail_dropped' && r.data.duration === 27 && !r.data.connected_at, r.data);
  r = await call('GET', `/contacts?q=Ann`);
  t('contact marked voicemailed', r.data.contacts[0].status === 'voicemailed' && r.data.contacts[0].call_attempts === 1, r.data.contacts[0]);
  r = await call('GET', '/dialer/queue');
  t('recently called excluded from queue', !r.data.contacts.some((c) => c.id === ann.id), r.data.contacts.map((c) => c.id));

  // call 2: human is dropped into your conference
  r = await call('POST', '/dialer/call', { contact_id: bob.id, auto_vm: false });
  const c2 = r.data.call.id;
  hook = await be.webhook(`/hook/lead-answer?call=${c2}`, { AnsweredBy: 'human' });
  t('human -> your conference', new RegExp(`<Conference[^>]*startConferenceOnEnter="false"[^>]*endConferenceOnExit="false"[^>]*>${confName}<`).test(hook.text), hook.text);
  r = await call('GET', `/calls/${c2}`);
  t('connected_at set', !!r.data.connected_at && r.data.answered_by === 'human', r.data);
  const leadSid = sw('/Calls').slice(-1)[0].sid;
  r = await call('POST', `/calls/${c2}/voicemail`, {});
  const redirect = sw(`/Calls/${leadSid}`).pop().params;
  t('manual vm drop redirects the lead call', r.status === 200 && /\/hook\/play\?k=[0-9a-f]+&rec=/.test(redirect.Url), redirect);
  hook = await be.webhook(`/hook/play?rec=${rec}`, {});
  t('play hook returns audio', hook.text.includes(`<Play>${WORKER_ORIGIN}/audio/${rec}.wav</Play>`), hook.text);
  r = await call('POST', `/calls/${c2}/hangup`);
  t('hangup sends Status=completed', sw(`/Calls/${leadSid}`).pop().params.Status === 'completed', r);
  r = await call('POST', `/calls/${c2}/disposition`, { disposition: 'interested', notes: 'wants a demo' });
  r = await call('GET', '/contacts?q=0102');
  t('disposition updates contact', r.data.contacts[0].status === 'interested' && r.data.contacts[0].notes.includes('demo'), r.data.contacts[0]);
  r = await call('POST', `/calls/${c2}/disposition`, { disposition: 'no_answer' });
  r = await call('GET', '/contacts?q=0102');
  t('soft disposition keeps real outcome', r.data.contacts[0].status === 'interested', r.data.contacts[0]);

  // lead answers after your phone hung up
  hook = await be.webhook('/hook/agent-status', { CallSid: agentSid, CallStatus: 'completed' });
  r = await call('GET', '/dialer/session');
  t('session ended by your hangup', r.data.status === 'ended', r);
  const cy = (await call('GET', '/contacts?q=5550102')).data.contacts[0];
  const ann2 = (await call('GET', '/contacts?q=Ann')).data.contacts[0];
  r = await call('POST', '/dialer/call', { contact_id: ann2.id, auto_vm: true });
  t('no calls while session is over', r.status === 400, r);

  // restart a session, DNC + hours
  r = await call('POST', '/dialer/session/start');
  const sid2 = sw('/Calls').pop().sid;
  await be.webhook('/hook/agent-answer', { CallSid: sid2 });
  r = await call('POST', '/dialer/call', { contact_id: ann.id, auto_vm: true });
  const c3 = r.data.call.id;
  hook = await be.webhook(`/hook/lead-answer?call=${c3}`, { AnsweredBy: 'human' });
  await call('POST', `/calls/${c3}/disposition`, { disposition: 'dnc' });
  r = await call('POST', '/dialer/call', { contact_id: ann.id, auto_vm: true });
  t('DNC blocks calls', r.status === 400 && /do-not-call/.test(r.data.error), r);

  r = await call('POST', '/dialer/session/end');
  t('session end hangs up your phone', r.data.status === 'ended' && sw(`/Calls/${sid2}`).pop().params.Status === 'completed', r);
  hook = await be.webhook(`/hook/lead-answer?call=${c3}`, { AnsweredBy: 'human' });
  t('human with no session gets a polite hangup', hook.text.includes('<Say>') && hook.text.includes('<Hangup/>') && !hook.text.includes('Conference'), hook.text);

  await call('POST', '/dialer/session/start');
  await be.webhook('/hook/agent-answer', { CallSid: sw('/Calls').pop().sid });
  r = await call('POST', '/dialer/call', { contact_id: bob.id, auto_vm: false });
  t('calls allowed any hour by default', r.status === 200, r);
  await call('PUT', '/settings', { enforce_hours: true, timezone: 'America/New_York', window_start: 9, window_end: 20 });
  be.sdb.run("UPDATE settings SET value = '3' WHERE key IN ('window_start', 'window_end')"); // an always-closed window, whatever time it is
  r = await call('POST', '/dialer/call', { contact_id: bob.id, auto_vm: false });
  t('outside hours blocked once turned on', r.status === 400 && /calling hours/.test(r.data.error), r);
  const W = { enforce_hours: true, timezone: 'America/New_York', window_start: 11, window_end: 20 };
  t('inWindow fn', inWindow(W, new Date('2025-01-15T17:00:00Z')) === true && inWindow(W, new Date('2025-01-15T06:00:00Z')) === false && inWindow({ ...W, enforce_hours: false }, new Date('2025-01-15T06:00:00Z')) === true && inWindow({ ...W, timezone: '' }, new Date('2025-01-15T06:00:00Z')) === true);
  r = await call('POST', '/sms/process');
  t('SMS queue honours hours', r.data.skipped === 'outside_hours', r);

  // inbound call forwards to your phone
  hook = await be.webhook('/hook/inbound-call', { From: '+14155550101' });
  t('inbound call rings your phone', hook.text.includes('<Dial timeout="20">+16505550199</Dial>'), hook.text);

  r = await call('GET', '/stats');
  t('stats', r.data.contacts >= 7 && r.data.voicemails >= 1 && r.data.sms_sent >= 1, r.data);
  r = await call('GET', '/calls');
  t('calls log', r.data.length >= 3 && r.data[0].first_name !== undefined, r.data.length);

  r = await call('POST', '/contacts/bulk', { ids: [bob.id], action: 'delete' });
  r = await call('GET', '/contacts');
  t('bulk delete', !r.data.contacts.some((c) => c.id === bob.id));
} catch (e) {
  fail++;
  out.textContent += 'EXCEPTION ' + (e.stack || e) + '\n';
}
out.textContent += `\n${pass} passed, ${fail} failed\n`;
document.title = fail ? 'FAILED' : 'ALL PASSED';
</script>
